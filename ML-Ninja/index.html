<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ML Ninja — Interactive Fruit Ninja Machine Learning</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
      :root {
        --bg-dark: #0a0c14;
        --panel-bg: rgba(16, 20, 34, 0.75);
        --panel-border: rgba(255, 255, 255, 0.12);
        --accent-cyan: #00e5ff;
        --accent-green: #00e676;
        --accent-red: #ff1744;
        --accent-gold: #ffd600;
        --text-main: #f0f4f8;
        --text-dim: #90a4ae;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
      }

      body {
        background: var(--bg-dark);
        color: var(--text-main);
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        overflow: hidden;
        width: 100vw;
        height: 100vh;
      }

      #canvas-container {
        position: absolute;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        z-index: 1;
        cursor: crosshair;
      }

      .glass-panel {
        background: var(--panel-bg);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        border: 1px solid var(--panel-border);
        border-radius: 12px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.45);
        z-index: 10;
        pointer-events: auto;
      }

      /* Top HUD */
      #hud-top {
        position: absolute;
        top: 14px;
        left: 14px;
        right: 14px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        z-index: 20;
        pointer-events: none;
      }

      .hud-left, .hud-center, .hud-right {
        display: flex;
        align-items: center;
        gap: 12px;
        pointer-events: auto;
      }

      .hud-brand {
        font-size: 20px;
        font-weight: 900;
        letter-spacing: 1.5px;
        background: rgba(10, 12, 20, 0.7);
        padding: 8px 16px;
        border-radius: 8px;
        border: 1px solid var(--panel-border);
      }
      .brand-ml { color: var(--accent-cyan); text-shadow: 0 0 10px rgba(0, 229, 255, 0.6); }
      .brand-ninja { color: #ffffff; }

      .mode-badge {
        font-size: 11px;
        font-weight: 800;
        padding: 6px 12px;
        border-radius: 20px;
        letter-spacing: 1px;
        text-transform: uppercase;
        background: rgba(0, 229, 255, 0.15);
        color: var(--accent-cyan);
        border: 1px solid var(--accent-cyan);
      }
      .mode-freeze { background: rgba(0, 230, 118, 0.15); color: var(--accent-green); border-color: var(--accent-green); }
      .mode-train { background: rgba(255, 214, 0, 0.15); color: var(--accent-gold); border-color: var(--accent-gold); }
      .mode-test { background: rgba(255, 23, 68, 0.15); color: var(--accent-red); border-color: var(--accent-red); }
      .mode-challenge { background: rgba(186, 104, 200, 0.2); color: #ce93d8; border-color: #ce93d8; }

      .stat-box {
        display: flex;
        flex-direction: column;
        align-items: center;
        background: rgba(10, 12, 20, 0.7);
        padding: 6px 14px;
        border-radius: 8px;
        border: 1px solid var(--panel-border);
      }
      .stat-label {
        font-size: 9px;
        font-weight: 700;
        letter-spacing: 1px;
        color: var(--text-dim);
      }
      .stat-value {
        font-size: 16px;
        font-weight: 800;
        color: #ffffff;
        font-family: 'Fira Code', monospace;
      }
      .combo-pulse { color: var(--accent-gold); text-shadow: 0 0 8px var(--accent-gold); transform: scale(1.1); }
      .lives-container { display: flex; gap: 4px; font-size: 15px; }
      .heart.dead { opacity: 0.2; filter: grayscale(1); }

      .hud-btn {
        background: rgba(10, 12, 20, 0.7);
        border: 1px solid var(--panel-border);
        color: #ffffff;
        padding: 8px 12px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 14px;
        transition: all 0.2s;
      }
      .hud-btn:hover { background: rgba(255, 255, 255, 0.1); border-color: var(--accent-cyan); }

      /* lil-gui Custom Styling */
      #left-gui-container {
        position: absolute;
        top: 76px;
        left: 14px;
        z-index: 15;
      }
      .lil-gui {
        --background-color: rgba(16, 20, 34, 0.85);
        --text-color: #f0f4f8;
        --title-background-color: rgba(24, 30, 50, 0.9);
        --widget-color: rgba(255, 255, 255, 0.08);
        --hover-color: rgba(0, 229, 255, 0.2);
        --focus-color: var(--accent-cyan);
        --number-color: var(--accent-cyan);
        --string-color: #ffd600;
        font-family: 'Inter', sans-serif !important;
        border-radius: 10px;
        overflow: hidden;
        border: 1px solid var(--panel-border);
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
      }

      /* Right Explainer Panel */
      #right-panel {
        position: absolute;
        top: 76px;
        right: 14px;
        width: 310px;
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .panel-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid var(--panel-border);
        padding-bottom: 8px;
      }
      .panel-header h3 { font-size: 17px; font-weight: 800; }
      .badge-tag {
        font-size: 9px;
        font-weight: 800;
        text-transform: uppercase;
        padding: 3px 8px;
        border-radius: 12px;
      }
      .badge-linear { background: rgba(0, 229, 255, 0.2); color: var(--accent-cyan); }
      .badge-nonlinear { background: rgba(255, 214, 0, 0.2); color: var(--accent-gold); }

      .explainer-section { display: flex; flex-direction: column; gap: 4px; }
      .section-label { font-size: 10px; font-weight: 800; letter-spacing: 0.8px; color: var(--text-dim); }
      .formula-box {
        font-family: 'Fira Code', monospace;
        font-size: 11px;
        padding: 8px 10px;
        background: rgba(0, 0, 0, 0.4);
        border: 1px solid rgba(0, 229, 255, 0.2);
        border-radius: 6px;
        color: #80d8ff;
        overflow-x: auto;
      }
      .section-text { font-size: 12px; line-height: 1.45; color: #cfd8dc; }
      .failure-label { color: #ff8a80; }
      .failure-text { color: #ffcdd2; font-size: 11px; }

      .step-metrics {
        display: flex;
        justify-content: space-between;
        background: rgba(0, 0, 0, 0.3);
        padding: 6px 10px;
        border-radius: 6px;
        font-size: 11px;
        font-family: 'Fira Code', monospace;
      }

      /* Charts Panel (Bottom Right) */
      #charts-panel {
        position: absolute;
        bottom: 74px;
        right: 14px;
        width: 310px;
        padding: 12px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .chart-box { display: flex; flex-direction: column; gap: 4px; }
      .chart-title { font-size: 10px; font-weight: 800; letter-spacing: 0.8px; color: var(--text-dim); }

      .confusion-grid {
        display: grid;
        grid-template-columns: 70px 1fr 1fr;
        gap: 2px;
        font-size: 10px;
        font-family: 'Fira Code', monospace;
      }
      .cm-cell {
        padding: 4px 6px;
        text-align: center;
        border-radius: 4px;
        background: rgba(255, 255, 255, 0.04);
      }
      .cm-header { font-weight: 600; color: var(--text-dim); }
      .cm-tp { background: rgba(0, 230, 118, 0.25); color: #b9f6ca; font-weight: bold; }
      .cm-tn { background: rgba(0, 230, 118, 0.25); color: #b9f6ca; font-weight: bold; }
      .cm-fp { background: rgba(255, 23, 68, 0.25); color: #ff8a80; }
      .cm-fn { background: rgba(255, 23, 68, 0.25); color: #ff8a80; }

      /* Bottom Controls */
      #bottom-controls {
        position: absolute;
        bottom: 12px;
        left: 50%;
        transform: translateX(-50%);
        padding: 10px 20px;
        display: flex;
        align-items: center;
        gap: 20px;
      }

      .playback-buttons { display: flex; gap: 8px; }
      .ctrl-btn {
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid var(--panel-border);
        color: var(--text-main);
        padding: 6px 14px;
        border-radius: 6px;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s;
      }
      .ctrl-btn:hover { background: rgba(255, 255, 255, 0.16); }
      .primary-ctrl {
        background: rgba(0, 229, 255, 0.2);
        border-color: var(--accent-cyan);
        color: #ffffff;
      }
      .primary-ctrl:hover, .primary-ctrl.playing {
        background: var(--accent-cyan);
        color: #0a0c14;
        box-shadow: 0 0 14px rgba(0, 229, 255, 0.6);
      }

      .speed-slider-group {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 11px;
        color: var(--text-dim);
      }
      .speed-slider-group input[type=range] {
        width: 80px;
        accent-color: var(--accent-cyan);
        cursor: pointer;
      }
      #speed-label { font-family: 'Fira Code', monospace; color: var(--accent-cyan); width: 30px; }

      .shortcuts-hint {
        display: flex;
        gap: 10px;
        font-size: 10px;
        color: var(--text-dim);
        border-left: 1px solid var(--panel-border);
        padding-left: 16px;
      }
      .shortcuts-hint span b {
        background: rgba(255, 255, 255, 0.1);
        padding: 1px 4px;
        border-radius: 3px;
        color: #ffffff;
      }

      /* Hover Tooltip */
      .glass-tooltip {
        position: absolute;
        padding: 8px 12px;
        background: rgba(14, 18, 30, 0.9);
        border: 1px solid var(--accent-cyan);
        border-radius: 6px;
        font-size: 11px;
        pointer-events: none;
        z-index: 100;
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.6);
      }
      .tooltip-header { font-weight: 800; font-size: 12px; margin-bottom: 4px; }
      .tooltip-row { display: flex; justify-content: space-between; gap: 8px; color: var(--text-dim); }
      .tooltip-row b { color: #ffffff; font-family: 'Fira Code', monospace; }

      /* Tutorial Modal */
      .tutorial-backdrop {
        position: absolute;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: rgba(0, 0, 0, 0.7);
        backdrop-filter: blur(6px);
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 200;
      }
      .tutorial-card {
        width: 440px;
        padding: 28px;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      .tutorial-step-indicator {
        font-size: 10px;
        font-weight: 800;
        letter-spacing: 1.5px;
        color: var(--accent-cyan);
      }
      .tutorial-title { font-size: 20px; font-weight: 900; }
      .tutorial-body { font-size: 13px; line-height: 1.6; color: #b0bec5; }
      .tutorial-actions { display: flex; justify-content: space-between; margin-top: 10px; }
    </style>
  </head>
  <body>
    <div id="canvas-container"></div>
    <div id="left-gui-container"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
